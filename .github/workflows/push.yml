name: ad-monitor 企微推送

on:
  schedule:
    # 每 10 分钟触发一次；默认全天（周一~周日 00:00-24:00），
    # 时段判断在脚本内（PUSH_DAYS / PUSH_START / PUSH_END 三个仓库变量可调）
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ad-monitor-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 恢复去重状态（内容没变就不重复推）
        uses: actions/cache@v4
        with:
          path: .state
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      - name: 运行推送
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          # 可选：仓库 Variables 里配了就生效，不配＝周一~周日全天
          PUSH_DAYS: ${{ vars.PUSH_DAYS }}
          PUSH_START: ${{ vars.PUSH_START }}
          PUSH_END: ${{ vars.PUSH_END }}
        run: node push.js
